catalogMode: prefer

trustLockfile: true
cleanupUnusedCatalogs: true
ignoreWorkspaceRootCheck: true
shellEmulator: true
trustPolicy: no-downgrade
allowBuilds:
  "fsevents": true
packages:
  - packages/*
catalog:
  "@types/node": ^26.6.3
  tsdown: ^0.23.0
  "@babel/core": ^8.0.6
  "@babel/parser": ^8.0.6
  "@istanbuljs/schema": ^0.1.6
  "@jridgewell/trace-mapping": ^0.3.31
  obug: ^2.2.1
  oxfmt: ^0.70.0
  oxlint: ^1.85.0
  preact: ^10.29.8
  playwright: ^1.63.0
  vitest: ^5.0.2
  yaml: ^2.9.1
  "@vitest/browser-playwright": ^5.0.2
  "@vitest/coverage-v8": ^5.0.2
  typescript: ^7.0.2
  "@e18e/eslint-plugin": ^0.8.1
  changelogithub: ^15.0.5
minimumReleaseAgeExclude:
  - "@vitest/browser-playwright@5.0.0"
  - "@vitest/browser@5.0.0"
  - "@vitest/coverage-v8@5.0.0"
  - "@vitest/mocker@5.0.0"
  - "@vitest/pretty-format@5.0.0"
  - "@vitest/spy@5.0.0"
  - "@vitest/ui@5.0.0"
  - "@vitest/utils@5.0.0"
  - vitest@5.0.0

# Use local packages in test run
overrides:
  "@vitest/coverage-istanbul>@vitest/istanbul-lib-coverage": "./packages/istanbul-lib-coverage"
  "@vitest/coverage-istanbul>@vitest/istanbul-lib-instrument": "./packages/istanbul-lib-instrument"
  "@vitest/coverage-istanbul>@vitest/istanbul-lib-report": "./packages/istanbul-lib-report"
  "@vitest/coverage-istanbul>@vitest/istanbul-lib-source-maps": "./packages/istanbul-lib-source-maps"
  "@vitest/coverage-v8>@vitest/istanbul-lib-coverage": "./packages/istanbul-lib-coverage"
  "@vitest/coverage-v8>@vitest/istanbul-lib-report": "./packages/istanbul-lib-report"
