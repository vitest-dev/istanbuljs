  "@babel/preset-env": ^7.7.5
  "@babel/preset-react": ^7.7.4
  "@istanbuljs/schema": ^0.1.3
  "@jridgewell/trace-mapping": ^0.3.23
  babel-loader: ^8.0.6
  obug: ^2.1.4
  oxfmt: ^0.64.0
  oxlint: ^1.79.0
  react-dom: ^16.12.0
  react: ^16.12.0
  vitest: ^4.1.10
  yaml: ^2.9.0
  webpack-cli: ^3.3.10
